worker_processes 1;
pid /home/unifi-controller/kas-choplug-app/storage/framework/nginx/nginx.pid;
error_log /home/unifi-controller/kas-choplug-app/storage/logs/nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/unifi-controller/kas-choplug-app/storage/logs/nginx-access.log;
    sendfile on;

    server {
        listen 8081;
        server_name 192.168.21.233;
        root /home/unifi-controller/kas-choplug-app/public;
        index index.php;
        charset utf-8;

        client_max_body_size 2m;
        client_body_temp_path /home/unifi-controller/kas-choplug-app/storage/framework/nginx/body;
        fastcgi_temp_path /home/unifi-controller/kas-choplug-app/storage/framework/nginx/fastcgi;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}